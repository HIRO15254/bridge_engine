# Test corpora. Nothing here is committed; `cargo xtask corpus fetch` downloads every entry
# into corpus/data/<dest>, verifies the SHA-256, and unpacks archives. Tests read
# BRIDGE_CORPUS_DIR (default corpus/data) and skip when an entry is missing.
#
# sha256 = "" means "not pinned yet": xtask fetches it, prints the hash, and refuses to mark the
# entry as verified until the value is filled in here.

[[entry]]
name = "dds-list100"
description = "DDS v2.9.0 test hands with double-dummy tables (100 deals); tag-pinned, immutable"
url = "https://raw.githubusercontent.com/dds-bridge/dds/v2.9.0/hands/list100.txt"
sha256 = "5aff1f6bc7d23c3aea63ddb65c3fa3359da3733d8591cc9ee2f2bddaff1f6192"
unpack = "none"
dest = "dds/list100.txt"
formats = ["deal-string", "dd-table"]

[[entry]]
name = "dds-masterdd"
description = "DDS v2.9.0 master double-dummy set (83,691 deals); used by the --ignored differential test"
url = "https://raw.githubusercontent.com/dds-bridge/dds/v2.9.0/hands/masterDD.txt"
sha256 = "1c68f44ce4f8f74678bb4588e29f185e5a1bbc4993104ea4224adb5e9f0cd46d"
unpack = "none"
dest = "dds/masterDD.txt"
formats = ["deal-string", "dd-table"]

