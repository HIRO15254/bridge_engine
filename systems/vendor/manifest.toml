# External BML files used by the bridge-system tests. Nothing here is committed;
# `cargo xtask systems fetch` downloads every entry into systems/vendor/data/<dest>
# (or $BRIDGE_SYSTEMS_DIR/vendor/data/) and verifies the SHA-256. Tests skip when a file is
# missing. Files are fetched only, never committed (risk R8 in docs/design/12-roadmap.md).
#
# Every URL is pinned to a commit so that the hashes are stable:
#
# | Repository                   | Commit                                   | License |
# | ---------------------------- | ---------------------------------------- | ------- |
# | gpaulissen/bml               | bd2bdc75ac0a1bea1c16b73bf0532682fbbc694e | MIT     |
# | jdh8/bridge-systems          | 662eb1650d5df1735e5598af34c2a7bb19105f6a | MIT     |
# | gpaulissen/bridge-systems    | 09ee6335fbd287c028f0aa94793b9fd2ba5d4119 | MIT     |
#
# The MIT license of each repository was checked on 2026-09-18 (GitHub license API); the
# `license` field repeats it per entry. `sha256 = ""` means "not pinned yet" (see
# corpus/manifest.toml for the semantics).
#
# Layout of systems/vendor/data/:
#   bml-test/data/*.bml, bml-test/data/test_include.bml   gpaulissen/bml test inputs
#   bml-test/expected/*.bss                               expansion oracle (`bss.py` output, D7)
#   jdh8/**                                               jdh8/bridge-systems (Polish Club "wj",
#                                                         Blue Club, defensive methods, shared parts)
#   gjp/common/**                                         gpaulissen/bridge-systems shared parts
# Directory structure is preserved so that `#INCLUDE` paths resolve as in the source repository.

