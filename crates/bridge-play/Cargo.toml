[package]
name = "bridge-play"
description = "Inference from the play: hard constraints, lead and signal agreements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["bridge-core/std", "bridge-constraint/std"]
serde = ["dep:serde", "bridge-core/serde", "bridge-constraint/serde"]

[dependencies]
bridge-constraint = { workspace = true }
bridge-core = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
