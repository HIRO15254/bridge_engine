[package]
name = "bridge-dds"
description = "Safe wrapper around Bo Haglund's DDS double-dummy solver (vendored C++ sources)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "dds"
build = "build.rs"
# R14 (docs/design/12-roadmap.md §10): `vendor/` is git-ignored (fetched by `cargo xtask dds
# vendor`), so without an explicit `include` a `cargo publish` package would omit it entirely
# and `build.rs` would compile with the FFI layer disabled for every downstream consumer. List
# only what `build.rs` actually reads (the extracted sources, not `vendor/*.tar.gz` or
# `SHA256SUMS`, which together are the other ~14 MB of `cargo xtask dds vendor`'s download and
# are not needed to build); see VENDOR.md.
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "VENDOR.md",
    "vendor/dds-2.9.0/src/**",
    "vendor/dds-2.9.0/include/**",
    "vendor/dds-2.9.0/LICENSE",
]

[features]
default = []
openmp = []

[dependencies]
bridge-core = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[build-dependencies]
cc = { workspace = true }
