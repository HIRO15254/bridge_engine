[package]
name = "bridge-bidding"
description = "Auction interpreter and bid generator derived from a compiled bidding system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["bridge-core/std", "bridge-constraint/std", "bridge-system/std"]
serde = ["dep:serde", "bridge-core/serde", "bridge-constraint/serde", "bridge-system/serde"]

[dependencies]
bridge-constraint = { workspace = true }
bridge-core = { workspace = true }
bridge-system = { workspace = true }
serde = { workspace = true, optional = true }
smallvec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rand_xoshiro = { workspace = true }

[[bench]]
name = "interpret"
harness = false
