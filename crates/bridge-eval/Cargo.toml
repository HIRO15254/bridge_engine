[package]
name = "bridge-eval"
description = "Hand evaluation for contract bridge: HCP, controls, losers, quick tricks, distribution points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["bridge-core/std"]
serde = ["dep:serde", "bridge-core/serde"]

[dependencies]
bridge-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "eval"
harness = false
