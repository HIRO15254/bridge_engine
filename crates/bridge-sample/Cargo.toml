[package]
name = "bridge-sample"
description = "Weighted deal sampling from auction and play constraints, with pluggable proposal distributions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
std = ["bridge-core/std", "bridge-constraint/std", "bridge-bidding/std", "bridge-play/std"]
serde = ["dep:serde", "bridge-core/serde", "bridge-constraint/serde"]
parallel = ["dep:rayon"]

[dependencies]
bridge-bidding = { workspace = true }
bridge-constraint = { workspace = true }
bridge-core = { workspace = true }
bridge-play = { workspace = true }
rand_core = { workspace = true }
rand_xoshiro = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Always available to tests (independent of the library's own optional `parallel` feature);
# the determinism test itself is gated on `cfg(feature = "parallel")`.
rayon = { workspace = true }
# Compiles `systems/sayc/sayc.bml` for `benches/deals.rs`'s real-SAYC-interpretation cases only
# (phase 5.4); not a library dependency.
bridge-system = { workspace = true, features = ["std"] }
# Parses the corpus auctions of `tests/ess_suite.rs` (phase 5.3's ESS suite); not a library
# dependency.
bridge-format = { workspace = true, features = ["std"] }
# `std` unlocks `tracing::subscriber::with_default`, used only by `tests/tracing_info.rs` to check
# the INFO line `sample_deals` emits; dev-dependencies are not part of the wasm32 build.
tracing = { workspace = true, features = ["std"] }

[[bench]]
name = "deals"
harness = false
